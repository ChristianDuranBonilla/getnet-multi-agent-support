name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install dependencies from the lockfile
        run: |
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (no network, no credentials)
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t getnet-agents:ci .
      # Vertex AI evaluations need credentials that are not in the repository, so CI
      # only proves that the image boots and reports readiness honestly without them.
      - name: Smoke test without credentials
        run: |
          docker run -d --name api -p 8080:8080 -e LOG_SALT=ci getnet-agents:ci
          for i in $(seq 1 24); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then break; fi
            sleep 5
          done
          curl -fsS http://localhost:8080/health | tee health.json
          grep -q '"ready":false' health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ready)" = "503"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/chat -X POST -H 'Content-Type: application/json' -d '{"message":"hi"}')" = "401"
      - name: Container logs
        if: failure()
        run: docker logs api
